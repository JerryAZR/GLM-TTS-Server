name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    # Decide whether the Docker image is affected. Tests always run; the
    # expensive image build/push only happens when image content changes.
    # (tests/, docs, .github/ are already .dockerignore'd; scripts/ are
    # client-side tools whose image copies are incidental.)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'api/**'
              - 'runpod-start.sh'
              - 'glmtts_inference.py'
              - 'cosyvoice/**'
              - 'flow/**'
              - 'llm/**'
              - 'utils/**'
              - 'configs/**'
              - 'frontend/**'
              - 'voices/**'
              - 'authorized_keys.json'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run unit tests
        run: pytest tests/test_auth_unit.py -v

      - name: Run mock-mode integration tests
        run: pytest tests/test_server_mock.py tests/test_auth.py -v

  docker:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t glm-tts-server:test .

      - name: Run mock container and verify endpoints
        run: |
          # The image ships a real authorized_keys.json (baked in from the repo
          # root), so API requests need a token. Enroll a throwaway CI key via
          # the volume path, which takes precedence over the baked-in file.
          ssh-keygen -t ed25519 -f ci-key -N "" -q
          mkdir -p ci-workspace
          cat > ci-workspace/authorized_keys.json <<EOF
          { "keys": [ { "public_key": "$(cat ci-key.pub)", "role": "admin" } ] }
          EOF
          pip install --quiet PyJWT cryptography
          TOKEN=$(python scripts/make_token.py --key ci-key --expires 600)

          docker run -d --rm \
            -p 8000:8000 \
            -e GLM_TTS_MOCK_INFERENCE=1 \
            -v "$(pwd)/ci-workspace:/workspace" \
            --name glm-tts-test \
            glm-tts-server:test
          # Wait for the non-blocking startup to finish.
          for i in {1..30}; do
            if curl -fs http://localhost:8000/ready | grep -q '"ready":true'; then
              break
            fi
            sleep 1
          done
          # Public endpoints need no token.
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready
          # /v1 endpoints require a valid JWT now.
          curl -f -H "Authorization: Bearer ${TOKEN}" http://localhost:8000/v1/models
          curl -f -H "Authorization: Bearer ${TOKEN}" http://localhost:8000/v1/voices
          # Without a token they must reject with 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/models)" = "401"
          docker stop glm-tts-test

  push-image:
    # Push the smoke-tested image to GHCR so RunPod can pull it directly.
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name (GHCR requirement)
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "${IMAGE_NAME}:latest" -t "${IMAGE_NAME}:sha-${GITHUB_SHA::7}" .
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
