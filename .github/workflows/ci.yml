name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest httpx

      - name: Run mock-mode tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t glm-tts-server:test .

      - name: Run mock container and verify endpoints
        run: |
          docker run -d --rm \
            -p 8000:8000 \
            -e GLM_TTS_MOCK_INFERENCE=1 \
            --name glm-tts-test \
            glm-tts-server:test
          # Wait for the non-blocking startup to finish.
          for i in {1..30}; do
            if curl -fs http://localhost:8000/ready | grep -q '"ready": true'; then
              break
            fi
            sleep 1
          done
          curl -f http://localhost:8000/health
          curl -f http://localhost:8000/ready
          curl -f http://localhost:8000/v1/models
          curl -f http://localhost:8000/v1/voices
          docker stop glm-tts-test
